name: Org Profile Lint

on:
  schedule:
    # Run every Monday at 09:00 UTC
    - cron: '0 9 * * 1'
  push:
    paths:
      - 'profile/**'
      - 'CHANGELOG.md'
      - '.github/workflows/profile-lint.yml'
      - 'scripts/validate-profile.sh'
  pull_request:
    paths:
      - 'profile/**'
      - 'CHANGELOG.md'

permissions:
  contents: read
  issues: write

jobs:
  validate:
    name: Validate org profile
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Make validation script executable
        run: chmod +x scripts/validate-profile.sh

      - name: Run profile validation
        id: validate
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_PROFILE_WEBHOOK_URL }}
        run: |
          set +e
          OUTPUT=$(bash scripts/validate-profile.sh 2>&1)
          EXIT_CODE=$?
          echo "$OUTPUT"
          echo "exit_code=$EXIT_CODE" >> "$GITHUB_OUTPUT"
          # Store multi-line output for the issue body
          {
            echo 'validation_output<<EOF_VALIDATION'
            echo "$OUTPUT"
            echo 'EOF_VALIDATION'
          } >> "$GITHUB_OUTPUT"

      - name: File issue on failure (scheduled runs only)
        if: >
          steps.validate.outputs.exit_code != '0' &&
          github.event_name == 'schedule'
        uses: actions/github-script@v7
        with:
          script: |
            const output = `${{ steps.validate.outputs.validation_output }}`;
            const title = `[Automated] Org profile drift detected – ${new Date().toISOString().slice(0, 10)}`;

            // Check for an existing open issue with the same title prefix to avoid duplicates
            const { data: issues } = await github.rest.issues.listForRepo({
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: 'open',
              labels: 'profile-lint',
            });

            const alreadyOpen = issues.some(i => i.title.startsWith('[Automated] Org profile drift detected'));
            if (alreadyOpen) {
              core.info('Open profile-lint issue already exists — skipping duplicate');
              return;
            }

            await github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title,
              body: [
                '## Org profile validation failed',
                '',
                'The scheduled profile lint job detected drift. Details:',
                '',
                '```',
                output,
                '```',
                '',
                '**Next steps:** Review the errors above, update `profile/` or `CHANGELOG.md`, and push a fix.',
                '',
                '_This issue was filed automatically by the [Org Profile Lint workflow](https://github.com/Aradotso/.github/actions/workflows/profile-lint.yml)._',
              ].join('\n'),
              labels: ['profile-lint'],
            });

      - name: Fail the job if validation failed
        if: steps.validate.outputs.exit_code != '0'
        run: |
          echo "Profile validation failed — see output above."
          exit 1
