name: Profile Health Check

on:
  schedule:
    # Run every Monday at 09:00 UTC
    - cron: "0 9 * * 1"
  push:
    branches:
      - main
    paths:
      - "profile/**"
      - "CHANGELOG.md"
      - "scripts/profile_health_check.py"
      - ".github/workflows/profile-health-check.yml"
  workflow_dispatch: {}

permissions:
  contents: read
  issues: write   # needed to file drift issues

jobs:
  health-check:
    name: Validate org profile
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Run profile health check
        id: health
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPO: ${{ github.repository }}
          SLACK_WEBHOOK_URL: ${{ secrets.PROFILE_HEALTH_SLACK_WEBHOOK }}
        run: python scripts/profile_health_check.py
        # Allow the step to fail without failing the job immediately so we can
        # surface a clear summary; the job fails via the check below.

      - name: Assert all checks passed
        if: steps.health.outcome == 'failure'
        run: |
          echo "::error::One or more profile health checks failed. A GitHub issue has been filed (if GITHUB_TOKEN is set) and/or a Slack notification sent."
          exit 1
